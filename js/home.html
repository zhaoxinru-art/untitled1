<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home - Simply Rugby Sounds</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, .08);
            --glass-border: rgba(255, 255, 255, .18);
        }
        body {
            background: #121212;
            color: #e5e7eb;
            padding-top: 70px; /* 固定导航栏占位 */
        }
        /* ===== 导航栏 ===== */
        .navbar-glass {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background-color: var(--glass-bg);
            border-bottom: 1px solid var(--glass-border);
        }
        /* ===== 滑动区域 ===== */
        .scroll-row {
            display: flex;
            gap: 1.2rem;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding-bottom: .5rem;
        }
        .scroll-row::-webkit-scrollbar {
            height: 0; /* 隐藏默认滚动条 */
        }
        .card-slide {
            flex: 0 0 160px;
            cursor: pointer;
            transition: transform .3s;
        }
        .card-slide:hover {
            transform: translateY(-6px);
        }
        .card-slide img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
        }
        /* 大标题 */
        .section-title {
            font-weight: 600;
            letter-spacing: .5px;
        }
    </style>
</head>
<body>

<!-- ========== 导航栏 ========== -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top navbar-glass">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#"><i class="bi bi-vinyl-fill me-2"></i>Simply Rugby Sounds</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Discover</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Library</a></li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <img src="https://picsum.photos/40/40?random=1" alt="avatar" class="rounded-circle">
                <span class="d-none d-md-block">Hi, User</span>
            </div>
        </div>
    </div>
</nav>

<!-- ========== 主内容 ========== -->
<main class="container">
    <!-- Recently Played -->
    <section class="mb-5">
        <h4 class="section-title mb-3">Recently Played</h4>
        <div class="scroll-row" id="recent"></div>
    </section>

    <!-- Made For You -->
    <section class="mb-5">
        <h4 class="section-title mb-3">Made For You</h4>
        <div class="scroll-row" id="made"></div>
    </section>

    <!-- Your Playlists -->
    <section class="mb-5">
        <h4 class="section-title mb-3">Your Playlists</h4>
        <div class="scroll-row" id="playlists"></div>
    </section>
</main>

<script src="js/bootstrap.bundle.min.js"></script>
<script>
    /* 生成滑动卡片 */
    function createSlide(id) {
        return `
        <div class="card-slide">
            <img src="https://picsum.photos/400/400?random=${id}" alt="cover">
            <p class="mt-2 mb-0 small text-truncate">Album Title ${id}</p>
            <span class="text-muted smaller">Artist ${id}</span>
        </div>`;
    }

    /* 填充 3 个滑轨 */
    ['recent', 'made', 'playlists'].forEach(track => {
        const row = document.getElementById(track);
        for (let i = 1; i <= 12; i++) row.innerHTML += createSlide(i + Math.random() * 1000 | 0);
    });

    /* 鼠标/触控拖拽滑动 */
    document.querySelectorAll('.scroll-row').forEach(row => {
        let mouseDown = false, startX, scrollLeft;
        row.addEventListener('mousedown', e => {
            mouseDown = true;
            startX = e.pageX - row.offsetLeft;
            scrollLeft = row.scrollLeft;
        });
        row.addEventListener('mouseleave', () => mouseDown = false);
        row.addEventListener('mouseup', () => mouseDown = false);
        row.addEventListener('mousemove', e => {
            if (!mouseDown) return;
            e.preventDefault();
            const x = e.pageX - row.offsetLeft;
            const walk = (x - startX) * 2; // 滑动速度
            row.scrollLeft = scrollLeft - walk;
        });
    });
</script>
</body>
</html>
