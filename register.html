<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">">
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-3.7.1.min.js"></script>
    <style>
        /* 背景颜色控制 */
        body {
            min-height: 100vh;
            background: radial-gradient(1200px 800px at 10% 10%,
            #6084fe33,transparent 60%),
            radial-gradient(1000px 700px at 90% 20%, #60a5fa33, transparent 60%),
            linear-gradient(135deg, #60a5e9 0%, #6366f1 50%, #db2777 100%);
            background-attachment: fixed;
        }

        /* 中间框的毛玻璃效果 */
        .glass-card {
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            background-color: rgba(255, 255, 255, .1);
            border: 1px solid rgba(255, 255, 255, .25);
        }

        /* 中间框logo图标效果 */
        .brand-badge {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            color: #fff;
            font-weight: 700;
        }
    </style>
</head>
<body class="d-flex align-items-center ">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-5 col-md-7 col-sm-9 ">
            <div class="card shadow glass-card border-0">
                <div class="card-body p-5">
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <div class="brand-badge">SQA</div>
                        <div>
                            <h1 class="h4 fw-semibold mb-1">Create Account</h1>
                            <p class="text-body-secondary mb-0"> Register as a Simply Rugby user</p >
                        </div>
                        <div class="ms-auto">
                            <i class="bi bi-emoji-grin text-body-secondary"></i>
                        </div>
                    </div>
                    <form class="needs-validation" novalidate>
                        <div  class="form-floating mb-3 ">
                            <input type="text" value="zulln" class="form-control" id="name" placeholder="name@example.com" required>
                            <label for="name"><i class="bi bi-person me-1"></i>Nick Name</label>
                        </div>
                        <div id="selectDiv" class="mb-3">
                            <select id="roleSelect" class="form-select">
                                <option></option>
                                <option>1</option>
                                <option>2</option>
                                <option>3</option>
                                <option>4</option>
                            </select>
                        </div>
                        <div class="form-floating mb-3 ">
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            <label for="email"><i class="bi bi-envelope me-1"></i>Email</label>
                        </div>
                        <div class="form-floating mb-3 ">
                            <input type="password" class="form-control" id="password" placeholder="name@example.com" required>
                            <label for="password"><i class="bi bi-lock me-1"></i>Password</label>
                        </div>
                        <div class="form-floating mb-3 ">
                            <input type="repassword" class="form-control" id="repassword" placeholder="name@example.com" required>
                            <label for="repassword"><i class="bi bi-shield-check me-1"></i>RePassword</label>
                        </div>
                        <div class="d-flex justify-content mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="check1" name="option1"
                                       value="something" checked>
                                <label class="form-check-label">I have read and agree</label>
                            </div>
                            <a href=" "
                               class=" small link-light link-underline-opacity-0 link-underline-opacity-100-hover">Terms of Service</a >
                        </div>
                        <button id="btn" class="btn btn-primary w-100 py-2 mb-3"
                                type="button"><i class="bi bi-person-add me-1"></i>Register an account
                        </button>
                        <div class="small text-body-secondary text-center mt-3">
                            Already have an account? <a href="#" class="link-light">Login now!</a >
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    $('form').on('submit', function (e) {
        e.preventDefault();

        let form = this;
        let nameData = $('#name').val();
        let emailData = $('#email').val();
        let passwordData = $('#password').val();
        let confirm = $('#confirm').val();

        const confirmEl = $('#confirm')[0];
        confirmEl.setCustomValidity('');

        if (passwordData !== confirm) {
            confirmEl.setCustomValidity('The two passwords did not match!');
        }

        $(form).removeClass('was-validated');
        if (!form.checkValidity()) {
            $(form).addClass('was-validated');
            return;
        }

        // 如果验证通过，可以继续提交表单或发送 AJAX 请求
    });

</script>
</body>
</html>
