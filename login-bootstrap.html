<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-3.7.1.min.js"></script>
    <style>
        /* 背景颜色控制 */
        body {
            min-height: 100vh;
            background: radial-gradient(1200px 800px at 10% 10%,
            #6084fe33,transparent 60%),
            radial-gradient(1000px 700px at 90% 20%, #60a5fa33, transparent 60%),
            linear-gradient(135deg, #60a5e9 0%, #6366f1 50%, #db2777 100%);
            background-attachment: fixed;
        }

        /* 中间框的毛玻璃效果 */
        .glass-card {
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            background-color: rgba(255, 255, 255, .1);
            border: 1px solid rgba(255, 255, 255, .25);
        }

        /* 中间框logo图标效果 */
        .brand-badge {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            color: #fff;
            font-weight: 700;
        }
    </style>
</head>
<body class="d-flex align-items-center ">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-11 col-lg-5 col-md-7 col-sm-9 ">
            <div class="card shadow glass-card border-0">
                <div class="card-body p-5">
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <div class="brand-badge">SQA</div>
                        <div>
                            <h1 class="h4 fw-semibold mb-1">Welcome.Simply Rugby</h1>
                            <p class="text-body-secondary mb-0"> Please login your account</p >
                        </div>
                        <div class="ms-auto">
                            <i class="bi bi-emoji-grin text-body-secondary"></i>
                        </div>
                    </div>
                    <form class="needs-validation" novalidate>
                        <div  class="form-floating mb-4 ">
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            <label for="email"><i class="bi bi-envelope me-1"></i>Email</label>
                        </div>
                        <div class="form-floating mb-2 ">
                            <input type="password" class="form-control" id="password" placeholder="name@example.com" required>
                            <label for="password"><i class="bi bi-lock me-1"></i>Password</label>
                        </div>
                        <div class="d-flex justify-content-between mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="check1" name="option1"
                                       value="something" checked>
                                <label class="form-check-label">Remember me</label>
                            </div>
                            <a href=" "
                               class=" small link-light link-underline-opacity-0 link-underline-opacity-100-hover">Forget
                                password?</a >
                        </div>
                        <button class="btn btn-primary w-100 py-2"><i class="bi bi-box-arrow-in-right me-1"></i>Login
                        </button>
                        <div class="small text-body-secondary text-center mt-3">
                            Not account? <a href="#" class="link-light">Register an account</a >
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
<script>
    $('form').on('submit', function (e) {
        e.preventDefault();
        let form = this;
        $(form).removeClass('was-validated');
        if (!form.checkValidity()) {
            $(form).addClass('was-validated');
            return;
        }
        let emailData = $('#email').val();
        let passwordData = $('#password').val();

        $.ajax({
            url: 'http://localhost:8000/user/login',
            type: 'POST',
            data: {
                email: $('#email').val().trim(),
                password: $('#password').val().trim()
            },
            success: function (res) {
                if (res === 'success') {
                    location.href = 'home.html';
                } else {
                    alert('账号或密码错误');
                }
            },
            error: function (xhr) {
                alert('登录失败：' + (xhr.responseText || '网络/服务器错误'));
            }
        });
    });
</script>
